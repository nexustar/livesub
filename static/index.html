<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LiveSub</title>
  <!-- PWA: after "Add to Home Screen", iOS launches in fullscreen mode
       (no URL bar, no tab bar). Recovers ~50-100px of vertical space,
       especially valuable on iPhone landscape. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiveSub">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="static/manifest.json">
  <link rel="apple-touch-icon" href="static/icon-180.png">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div id="controls">
    <button id="toggle"><span class="icon">▶</span><span class="label">Start</span></button>
    <!-- Options can't hold SVG: the icon for the picked source sits over the
         select's left padding (app.js sets data-source). -->
    <span id="input-source-picker">
      <svg class="icon icon-mic" viewBox="0 0 16 16" width="1em" height="1em" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/>
        <path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/>
      </svg>
      <svg class="icon icon-screen" viewBox="0 0 16 16" width="1em" height="1em" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <path d="M1.5 6h13"/>
        <circle cx="3.9" cy="4.25" r="0.6" fill="currentColor" stroke="none"/>
        <circle cx="5.9" cy="4.25" r="0.6" fill="currentColor" stroke="none"/>
      </svg>
      <select id="input-source" title="Audio source">
        <option value="mic">Mic</option>
        <option value="screen">Tab</option>
      </select>
    </span>
    <span id="status">idle</span>
    <div id="vu" title="audio level">
      <div id="vu-fill"></div>
    </div>
    <span class="spacer"></span>
    <span class="badge" id="badge-mic" title="last audio peak (0-32767)">peak —</span>
    <span class="badge" id="badge-asr" title="ASR session count">asr 0</span>
    <span class="badge" id="badge-translate" title="translations completed / pending">tr 0/0</span>
    <button id="settings-toggle" class="secondary">
      <svg class="icon" viewBox="0 0 16 16" width="1em" height="1em" aria-hidden="true"
           fill="none" stroke="currentColor">
        <circle cx="8" cy="8" r="4.3" stroke-width="1.4"/>
        <circle cx="8" cy="8" r="1.6" stroke-width="1.4"/>
        <path stroke-width="2.2" d="M13 8H15M11.54 11.54L12.95 12.95M8 13V15M4.46 11.54L3.05 12.95M3 8H1M4.46 4.46L3.05 3.05M8 3V1M11.54 4.46L12.95 3.05"/>
      </svg><span class="label">Settings</span>
    </button>
    <!-- Only where Document Picture-in-Picture exists (Chrome / Edge). -->
    <button id="pip" class="secondary" title="Show captions in an always-on-top window" hidden>
      <!-- The usual picture-in-picture glyph: a small window in a large one. -->
      <svg class="icon" viewBox="0 0 16 16" width="1em" height="1em" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <rect x="8" y="8" width="5" height="4" rx="0.5" fill="currentColor"/>
      </svg><span class="label">Pop out</span>
    </button>
    <button id="clear" class="secondary"><span class="icon">✕</span><span class="label">Clear</span></button>
  </div>

  <div id="settings-panel" hidden>
   <div class="settings-form">
    <div class="settings-tabs" role="tablist">
      <button type="button" role="tab" data-tab="session">Session</button>
      <button type="button" role="tab" data-tab="backends">Backends</button>
      <button type="button" role="tab" data-tab="display">Display</button>
    </div>
    <div class="settings-tab-body">
    <div class="settings-tab" role="tabpanel" data-tab="session">
    <div class="row">
      <label for="source-lang-select">Source language</label>
      <!-- Normal mode: 11-language <select> = intersection of what every
           hint-accepting backend supports (qwen3-asr-flash-realtime's set).
           Debug mode swaps in the free-text input + datalist below for
           access to qwen-local's extra ~20 languages and any value the user
           wants to pass through to Whisper's 70+. CSS toggles visibility. -->
      <select id="source-lang-select">
        <option value="auto">Auto-detect</option>
        <option value="Chinese">Chinese</option>
        <option value="English">English</option>
        <option value="Japanese">Japanese</option>
        <option value="Korean">Korean</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="German">German</option>
        <option value="Italian">Italian</option>
        <option value="Portuguese">Portuguese</option>
        <option value="Russian">Russian</option>
        <option value="Arabic">Arabic</option>
      </select>
      <input id="source-lang-input" type="text" placeholder="auto" list="lang-options">
      <datalist id="lang-options">
        <option value="auto">
        <option value="Cantonese">
        <option value="Vietnamese">
        <option value="Thai">
        <option value="Hindi">
        <option value="Indonesian">
        <option value="Turkish">
        <option value="Dutch">
        <option value="Polish">
      </datalist>
    </div>
    <div class="row">
      <label for="target-lang">Target language</label>
      <input id="target-lang" type="text" placeholder="Chinese (Simplified)">
    </div>
    <div class="row span2" id="scene-seed-row">
      <label for="scene-seed">Topic for research <span class="optional">optional</span></label>
      <div class="hint-scene-row">
        <input id="scene-seed" type="text"
          placeholder="e.g. μ's Final Live concert; ICASSP 2026 keynote; FromSoftware Elden Ring stream">
        <button id="hint-generate" class="secondary" type="button">✨ Research</button>
      </div>
      <p class="hint">Fills in Scene and Glossary from a web search.</p>
      <span id="hint-status" class="muted"></span>
    </div>
    <div class="row span2">
      <label for="scene">Scene summary <span class="optional">optional</span></label>
      <textarea id="scene" rows="3"
        placeholder="e.g. Live concert by Japanese idol group μ's; use casual Chinese fan-slang and preserve idol terminology like 推し / ペンライト."></textarea>
      <p class="hint">Notes for the translator: setting, tone, style.</p>
    </div>
    <div class="row span2">
      <label for="glossary">Glossary <span class="optional">optional</span></label>
      <textarea id="glossary" rows="4"
        placeholder="高坂穂乃果, 絢瀬絵里, μ's, アンコール, ペンライト, ..."></textarea>
      <p class="hint">Names and terms in the source language, comma-separated.</p>
    </div>
    </div>
    <div class="settings-tab" role="tabpanel" data-tab="backends">
    <div class="row">
      <label for="asr-backend">Speech-to-text backend</label>
      <select id="asr-backend">
        <!-- options populated from /api/backends on load -->
      </select>
      <!-- Shown when the picked local model isn't downloaded yet. -->
      <p class="hint asr-model-hint" id="asr-model-hint" hidden>
        <span></span>
        <button type="button" class="secondary"></button>
      </p>
    </div>
    <div class="row">
      <label for="translate-backend">Translation backend</label>
      <select id="translate-backend">
        <!-- options populated from /api/backends on load -->
      </select>
    </div>
    <!-- Only when the qwen_asr binary was found. -->
    <div class="row span2 settings-section" id="models-section" hidden>
      <h3 class="section-title">Local models</h3>
      <div id="models-list"></div>
      <p id="models-dir" class="hint"></p>
    </div>
    </div>
    <div class="settings-tab" role="tabpanel" data-tab="display">
    <div class="row span2">
      <label class="toggle-row">
        <input id="font-large" type="checkbox">
        <span>
          <span class="toggle-title">Large captions</span>
          <span class="hint">For viewing from a distance.</span>
        </span>
      </label>
    </div>
    <div class="row span2">
      <label class="toggle-row">
        <input id="debug-mode" type="checkbox">
        <span>
          <span class="toggle-title">Debug mode</span>
          <span class="hint">Diagnostic badges and extra, less tested source languages.</span>
        </span>
      </label>
    </div>
    </div>
    </div>
   </div>
  </div>

  <div id="history"></div>

  <!-- Before anything is captioned: setup steps or a short how-to (app.js). -->
  <div id="welcome" hidden>
    <div class="welcome-card"></div>
  </div>

  <div id="caption-stack">
    <div id="caption-prev" class="caption-zone prev" hidden>
      <div id="prev-transcript" class="line transcript"></div>
      <div id="prev-translation" class="line translation"></div>
    </div>
    <div id="caption-current" class="caption-zone live">
      <div id="transcript" class="line transcript"></div>
      <div id="translation" class="line translation"></div>
      <div id="latest" class="line transcript latest" hidden></div>
    </div>
  </div>
  <!-- Takes the caption stack's place while it is in the pop-out window. -->
  <div id="pip-note" hidden>
    Captions are in the pop-out window.
    <button type="button" class="secondary" id="pip-return">Bring back</button>
  </div>

  <script src="static/app.js" type="module"></script>
</body>
</html>
